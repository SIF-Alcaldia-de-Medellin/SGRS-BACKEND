# SonarQube Project Configuration - Solo para Coverage de Tests
# Proyecto: SGRS-BACKEND

# Project identification
sonar.projectKey=SIF-Alcaldia-de-Medellin_SGRS-BACKEND
sonar.organization=sif-alcaldia-de-medellin

# Source code location
sonar.sources=src
sonar.tests=src

# Language
sonar.language=ts

# Test coverage - Solo lo esencial para coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.dto.ts,**/*.entity.ts,**/*.module.ts,**/*.config.ts,**/*.const.ts,**/*.guard.ts,**/*.pipe.ts,**/*.filter.ts,**/*.validation.ts

# Exclude patterns básicos
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/migrations/**
